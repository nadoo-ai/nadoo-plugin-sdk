[tool.poetry]
name = "nadoo-plugin-sdk"
version = "0.1.0"
description = "Official SDK for developing Nadoo AI KB plugins"
authors = ["Nadoo Team <dev@nadoo.ai>"]
readme = "README.md"
license = "MIT"
homepage = "https://nadoo.ai"
repository = "https://github.com/nadoo-ai/nadoo-plugin-sdk"
documentation = "https://docs.nadoo.ai/plugins"
keywords = ["nadoo", "plugin", "ai", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "nadoo_plugin"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.5.0"
httpx = "^0.25.0"
pyyaml = "^6.0"
click = "^8.1.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
nadoo-plugin = "nadoo_plugin.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
